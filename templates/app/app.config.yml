# App under test: <App name> (<platform>). Dev-owned source: <link to the app repo>
# Read by bin/qa (install + run) and by the pipeline agents. Flat `key: value` only.

name: <app>                        # must equal this folder's name under apps/
platform: ios                      # ios | android (android: runner not implemented yet)
app_id: com.example.app            # bundle id / package name — every flow's `appId`, checked on install

# Which build to test. Override per run with `bin/qa run <app> --build <path|url>`.
#   local path      ./builds/App.app.zip  or  /abs/path/App.app   (iOS: simulator build, not .ipa)
#   https URL       https://.../App.app.zip   (optional bearer token from $QA_BUILD_TOKEN)
#   GitHub release  gh-release:<owner>/<repo>@<tag|latest>/<asset>   (auth via $GH_TOKEN / gh auth)
build: gh-release:<owner>/<repo>@latest/<App>.app.zip

ios_device: iPhone 16              # simulator booted when none is running

tracker_mcp_server: <mcp-server>   # MCP server used for tickets in this Claude Code setup
tracker_project_key: <KEY>
