# qa-pipeline config — read by the qa-pipeline plugin's agents (Stages 2–4).
# CI inputs (artifact, simulator, tags) live in .github/workflows/qa.yml, not here.

app:
  name: MyApp
  platform: ios                  # ios | android (android: CI not implemented yet)
  app_id: com.example.myapp      # bundle id / package name — becomes each flow's `appId`

tracker:
  type: jira
  mcp_server: my-jira            # name of the MCP server (in this Claude Code setup) used for tickets
  project_key: ABC               # hint for searches only

paths:
  specs: specs                   # Stage 2 output: <specs>/<TICKET-ID>/spec.md
  tests: qa-tests                # Stage 3/4 output: <tests>/<module>/<feature>/CASES.md + *.yaml
  reports: reports               # Stage 8 output (not built yet)
  protected:                     # never written, migrated or deleted by any pipeline stage
    - .maestro
