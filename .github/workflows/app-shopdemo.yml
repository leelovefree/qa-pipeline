name: "App: shopdemo"

# WHEN to test ShopDemo. HOW lives in regression.yml. Copy this file for each new app (templates/app/).

on:
  # The app repo publishes a new build and notifies us (payload: {"build": "<path|url|gh-release:...>"}).
  repository_dispatch:
    types: [shopdemo-build]
  # QA changes tests or the framework → re-test against the app's configured (latest) build.
  pull_request:
    paths:
      - 'apps/shopdemo/**'
      - 'bin/**'
      - '.github/workflows/regression.yml'
      - '.github/workflows/app-shopdemo.yml'
  push:
    branches: [main]
    paths:
      - 'apps/shopdemo/**'
      - 'bin/**'
      - '.github/workflows/regression.yml'
      - '.github/workflows/app-shopdemo.yml'
  schedule:
    - cron: '0 3 * * *'   # nightly
  workflow_dispatch:
    inputs:
      build:
        description: "Build to test (path, https URL or gh-release:owner/repo@tag/asset). Empty = config."
        default: ""
      module:
        description: "Only this module under apps/shopdemo/tests/. Empty = all."
        default: ""

jobs:
  test:
    uses: ./.github/workflows/regression.yml
    with:
      app: shopdemo
      build: ${{ github.event.client_payload.build || inputs.build || '' }}
      module: ${{ inputs.module || '' }}
    secrets: inherit
