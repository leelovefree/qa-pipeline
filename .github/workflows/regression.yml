name: Regression (Stage 6 — zero AI calls, do not add any LLM step to this file)

# Reusable within this repo. Each apps/<app> has a small caller workflow (app-<app>.yml) that decides
# WHEN to run; this file decides HOW: install the build, run the app's Maestro flows via bin/qa — the
# same command QAs run locally. Pass/fail is Maestro's exit code; nothing here may override it.

on:
  workflow_call:
    inputs:
      app:
        description: "Folder under apps/"
        type: string
        required: true
      build:
        description: "Override the app's `build:` (path, https URL or gh-release:...). Empty = use config."
        type: string
        default: ""
      module:
        description: "Only run apps/<app>/tests/<module>. Empty = all modules."
        type: string
        default: ""
      tags:
        description: "Only run flows with these Maestro tags (comma-separated). Empty = all."
        type: string
        default: ""
      runner:
        type: string
        default: macos-15
    secrets:
      QA_BUILDS_TOKEN:
        description: "Token that can read the app repo's releases (gh-release builds) or bearer token for URLs."
        required: false

jobs:
  regression:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Maestro
        run: |
          brew install openjdk@17
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" >> "$GITHUB_ENV"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install build and run tests
        env:
          GH_TOKEN: ${{ secrets.QA_BUILDS_TOKEN }}
          QA_BUILD_TOKEN: ${{ secrets.QA_BUILDS_TOKEN }}
          APP: ${{ inputs.app }}
          BUILD: ${{ inputs.build }}
          MODULE: ${{ inputs.module }}
          TAGS: ${{ inputs.tags }}
        run: |
          args=()
          [ -z "$BUILD" ]  || args+=(--build "$BUILD")
          [ -z "$MODULE" ] || args+=(--module "$MODULE")
          [ -z "$TAGS" ]   || args+=(--tags "$TAGS")
          echo "Testing app=$APP build=${BUILD:-<from app.config.yml>}"
          bin/qa run "$APP" ${args[@]+"${args[@]}"}

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.app }}
          path: .qa-work/${{ inputs.app }}/report.xml
          if-no-files-found: ignore
