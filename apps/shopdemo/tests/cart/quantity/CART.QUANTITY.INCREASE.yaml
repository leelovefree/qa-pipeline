# Requirement: CART.QUANTITY.INCREASE
# Ticket: SCRUM-6 | Spec: apps/shopdemo/specs/SCRUM-6/spec.md | Case: apps/shopdemo/tests/cart/quantity/CASES.md
# Selectors observed via Maestro MCP inspect_screen on iPhone 17 (iOS 26.5) simulator, 2026-09-30.
# Row "+" is the row element with text "Add"; quantity label zero-padded ("02"), matched "^0*<n>$".
appId: com.qademo.iosshopdemo
---
- launchApp:
    clearState: true
- tapOn:
    id: login_email_field
- inputText: demo@shop.com
- tapOn:
    id: login_password_field
- inputText: "123456"
- tapOn:
    id: login_submit_button
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- assertVisible:
    id: home_screen
# Step 1
- tapOn: "Defile Lux Blazer"
- tapOn:
    id: product_detail_buy_now_button
- assertVisible:
    id: cart_screen
    text: "My Cart"
- assertVisible:
    id: cart_item_row_defile-lux-blazer-s-beige
    text: "^0*1$"
# Step 2
- tapOn:
    id: cart_item_row_defile-lux-blazer-s-beige
    text: "Add"
- assertVisible:
    id: cart_item_row_defile-lux-blazer-s-beige
    text: "^0*2$"
# Step 3: 10 more taps
- repeat:
    times: 10
    commands:
      - tapOn:
          id: cart_item_row_defile-lux-blazer-s-beige
          text: "Add"
- assertVisible:
    id: cart_item_row_defile-lux-blazer-s-beige
    text: "^0*12$"
- assertVisible:
    id: cart_item_row_defile-lux-blazer-s-beige
    text: "Add"
    enabled: true
