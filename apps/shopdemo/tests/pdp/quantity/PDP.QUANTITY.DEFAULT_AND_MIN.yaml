# Requirement: PDP.QUANTITY.DEFAULT_AND_MIN
# Ticket: SCRUM-6 | Spec: apps/shopdemo/specs/SCRUM-6/spec.md | Case: apps/shopdemo/tests/pdp/quantity/CASES.md
# Selectors observed via Maestro MCP inspect_screen on iPhone 17 (iOS 26.5) simulator, 2026-09-30.
# The quantity label renders zero-padded (observed "01" at default), so values are matched as
# "^0*<n>$" (anchored) — the numeric value is asserted exactly, only the padding is tolerated.
appId: com.qademo.iosshopdemo
---
- launchApp:
    clearState: true
- tapOn:
    id: login_email_field
- inputText: demo@shop.com
- tapOn:
    id: login_password_field
- inputText: "123456"
- tapOn:
    id: login_submit_button
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- assertVisible:
    id: home_screen
- tapOn: "Defile Lux Blazer"
- assertVisible:
    id: product_detail_screen
# Step 2: default is 1
- assertVisible:
    id: product_detail_quantity_value_label
    text: "^0*1$"
# Step 3: "-" at 1 keeps 1
- tapOn:
    id: product_detail_quantity_decrement_button
- assertVisible:
    id: product_detail_quantity_value_label
    text: "^0*1$"
# Step 4: + -> 2, - -> 1, - -> 1
- tapOn:
    id: product_detail_quantity_increment_button
- assertVisible:
    id: product_detail_quantity_value_label
    text: "^0*2$"
- tapOn:
    id: product_detail_quantity_decrement_button
- assertVisible:
    id: product_detail_quantity_value_label
    text: "^0*1$"
- tapOn:
    id: product_detail_quantity_decrement_button
- assertVisible:
    id: product_detail_quantity_value_label
    text: "^0*1$"
