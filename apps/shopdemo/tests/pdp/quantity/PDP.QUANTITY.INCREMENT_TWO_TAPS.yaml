# Requirement: PDP.QUANTITY.INCREMENT_TWO_TAPS
# Ticket: SCRUM-9 | Spec: apps/shopdemo/specs/SCRUM-9/spec.md | Case: apps/shopdemo/tests/pdp/quantity/CASES.md
# Selectors observed via Maestro MCP inspect_screen on iPhone 17 (iOS 26.5) simulator, 2026-10-03.
# The quantity label renders zero-padded (observed "01" at default), so values are matched as
# "^0*<n>$" (anchored) — the numeric value is asserted exactly, only the padding is tolerated.
appId: com.qademo.iosshopdemo
---
- launchApp:
    clearState: true
- tapOn:
    id: login_email_field
- inputText: demo@shop.com
- tapOn:
    id: login_password_field
- inputText: "123456"
- tapOn:
    id: login_submit_button
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- assertVisible:
    id: home_screen
# Step 1: first product in the list
- tapOn: "Defile Lux Blazer"
- assertVisible:
    id: product_detail_screen
# Step 2: precondition — default quantity is 1 (fails the flow if not, so the case never passes on a wrong start)
- assertVisible:
    id: product_detail_quantity_value_label
    text: "^0*1$"
# Steps 3–4: tap "+" twice
- tapOn:
    id: product_detail_quantity_increment_button
- tapOn:
    id: product_detail_quantity_increment_button
# Expected: quantity shows 3
- assertVisible:
    id: product_detail_quantity_value_label
    text: "^0*3$"
