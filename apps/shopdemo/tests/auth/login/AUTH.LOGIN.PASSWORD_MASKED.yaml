# Requirement: AUTH.LOGIN.PASSWORD_MASKED
# Ticket: SCRUM-5 | Spec: apps/shopdemo/specs/SCRUM-5/spec.md | Case: apps/shopdemo/tests/auth/login/CASES.md
# Selectors and masked value observed via Maestro MCP inspect_screen on iPhone 17 (iOS 26.5)
# simulator, 2026-09-29.
#
# KNOWN LIMITATION (reviewed and accepted by Linh Doan, 2026-09-29): the field's placeholder hint
# is "••••••", identical to the masked rendering of the 6-char input "123456". Maestro's text
# matcher and copyTextFrom both return the placeholder when the field is empty, so the positive
# "••••••" assertion below cannot prove input was typed. The load-bearing checks are the
# assertNotVisible ones: if the field rendered plain text, its value would be "123456" and they
# would fail. Accepted as-is (option a) rather than changing the test password or the app's
# placeholder.
#
# Also reviewed: the static "Demo account: demo@shop.com / 123456" label on the login screen is
# always visible regardless of masking. Confirmed the "never shown on screen" requirement applies
# to the password field only — the label is acceptable.
appId: com.qademo.iosshopdemo
---
- launchApp:
    clearState: true
- assertVisible:
    id: login_screen
- tapOn:
    id: login_password_field
- inputText: "123456"
- assertVisible:
    id: login_password_field
    text: "••••••"
- assertNotVisible:
    id: login_password_field
    text: "123456"
- assertNotVisible:
    text: "123456"
