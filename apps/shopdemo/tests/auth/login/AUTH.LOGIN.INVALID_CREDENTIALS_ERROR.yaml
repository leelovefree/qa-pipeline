# Requirement: AUTH.LOGIN.INVALID_CREDENTIALS_ERROR
# Ticket: SCRUM-5 | Spec: apps/shopdemo/specs/SCRUM-5/spec.md | Case: apps/shopdemo/tests/auth/login/CASES.md
# Selectors and error string observed via Maestro MCP inspect_screen on iPhone 17 (iOS 26.5)
# simulator, 2026-09-29.
appId: com.qademo.iosshopdemo
---
- launchApp:
    clearState: true
- assertVisible:
    id: login_screen
- tapOn:
    id: login_email_field
- inputText: nobody@shop.com
- tapOn:
    id: login_password_field
- inputText: wrongpass
- tapOn:
    id: login_submit_button
- assertVisible:
    id: login_error_message
    text: "Invalid email or password\\."
- assertVisible:
    id: login_screen
- assertVisible:
    id: login_email_field
- assertVisible:
    id: login_password_field
- assertVisible:
    id: login_submit_button
- assertNotVisible:
    id: home_screen
