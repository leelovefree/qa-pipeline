# Requirement: AUTH.LOGIN.SUCCESS_VALID_CREDENTIALS
# Ticket: SCRUM-5 | Spec: apps/shopdemo/specs/SCRUM-5/spec.md | Case: apps/shopdemo/tests/auth/login/CASES.md
# Selectors observed via Maestro MCP inspect_screen on iPhone 17 (iOS 26.5) simulator, 2026-09-29.
# Note: iOS shows a system "Save Password?" sheet after submit; it is dismissed conditionally via
# its observed "Not Now" button so it does not obscure the home screen assertion.
appId: com.qademo.iosshopdemo
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: login_screen
- tapOn:
    id: login_email_field
- inputText: demo@shop.com
- tapOn:
    id: login_password_field
- inputText: "123456"
- tapOn:
    id: login_submit_button
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- assertVisible:
    id: home_screen
- assertNotVisible:
    id: login_screen
